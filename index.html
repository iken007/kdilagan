<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Iken: opening November 1</title>
<meta name="description" content="Iken opens this November. Hand-thrown tableware, one-of-a-kind vases and open studio hours.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,300..800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #E3EBDD;
    --ink: #16205B;
    --muted: #4A5687;
    --line: rgba(22, 32, 91, .22);
    --ring: rgba(22, 32, 91, .07);
    --field: #F2F6EE;
    --glow: #F5823A;
    --vase-base: #2A40B0;
    --vase-dark: #0E1650;
    --band: #9FB2FF;
    --wheel-top: #C9D6C6;
    --wheel-side: #A5B7A2;
    --shadow: rgba(14, 22, 80, .28);
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #101745;
      --ink: #E6EFE2;
      --muted: #98A5D6;
      --line: rgba(230, 239, 226, .2);
      --ring: rgba(230, 239, 226, .06);
      --field: #18215C;
      --glow: #FF9147;
      --vase-base: #B4D6C2;
      --vase-dark: #3E6B58;
      --band: #F2FBF4;
      --wheel-top: #1D2A6E;
      --wheel-side: #0A1036;
      --shadow: rgba(0, 0, 0, .4);
    }
  }
  :root[data-theme="dark"] {
    --bg: #101745;
    --ink: #E6EFE2;
    --muted: #98A5D6;
    --line: rgba(230, 239, 226, .2);
    --ring: rgba(230, 239, 226, .06);
    --field: #18215C;
    --glow: #FF9147;
    --vase-base: #B4D6C2;
    --vase-dark: #3E6B58;
    --band: #F2FBF4;
    --wheel-top: #1D2A6E;
    --wheel-side: #0A1036;
    --shadow: rgba(0, 0, 0, .4);
  }

  *, *::before, *::after { box-sizing: inherit; }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .stage {
    position: relative;
    min-height: 100%;
    max-width: 1400px;
    margin: 0 auto;
    padding: clamp(1.25rem, 4vw, 3.5rem);
    display: grid;
    grid-template-columns: minmax(0, 1.1fr) minmax(0, .9fr);
    gap: clamp(2rem, 5vw, 6rem);
    align-items: center;
    overflow: hidden;
  }
  .rings {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: repeating-radial-gradient(circle at 76% 58%, transparent 0 46px, var(--ring) 46px 47px);
    -webkit-mask-image: radial-gradient(circle at 76% 58%, #000 0, transparent 72%);
            mask-image: radial-gradient(circle at 76% 58%, #000 0, transparent 72%);
  }

  .copy { position: relative; display: flex; flex-direction: column; gap: clamp(1.25rem, 2.6vw, 2rem); }
  .brand { font-weight: 700; font-size: 1.15rem; letter-spacing: -.01em; margin: 0 0 clamp(.5rem, 4vh, 3rem); }

  h1 {
    margin: 0;
    font-size: clamp(3.2rem, 9.2vw, 8.2rem);
    line-height: .92;
    letter-spacing: -.035em;
    font-weight: 800;
    font-variation-settings: "wdth" 76;
    text-wrap: balance;
  }
  .lead {
    margin: 0;
    max-width: 34rem;
    font-size: clamp(1.05rem, 1.5vw, 1.25rem);
    line-height: 1.5;
    color: var(--muted);
  }

  .when { margin: .5rem 0 0; font-size: clamp(1.05rem, 1.5vw, 1.25rem); font-weight: 600; }

  .btn {
    font: inherit;
    font-weight: 600;
    font-size: 1rem;
    border: 1.5px solid var(--ink);
    border-radius: 999px;
    padding: .9rem 1.6rem;
    background: var(--ink);
    color: var(--bg);
    cursor: pointer;
    transition: background-color .2s, color .2s, border-color .2s;
  }
  .btn:hover { background: var(--glow); border-color: var(--glow); color: #101745; }
  .btn.quiet { background: transparent; color: var(--ink); border-color: var(--line); padding: .55rem 1.1rem; font-size: .92rem; font-weight: 500; }
  .btn.quiet:hover { border-color: var(--ink); background: transparent; color: var(--ink); }

  :focus-visible { outline: 3px solid var(--glow); outline-offset: 3px; }

  .wheel { position: relative; margin: 0; display: flex; flex-direction: column; align-items: center; gap: 1rem; }
  .wheel svg { width: 100%; max-width: 520px; height: auto; display: block; cursor: ew-resize; touch-action: pan-y; user-select: none; -webkit-user-select: none; }
  .wheel figcaption { display: flex; align-items: center; gap: .9rem; flex-wrap: wrap; justify-content: center; color: var(--muted); font-size: .95rem; }

  .foot { grid-column: 1 / -1; position: relative; margin: 0; font-size: .9rem; color: var(--muted); }

  @media (max-width: 860px) {
    .stage { grid-template-columns: minmax(0, 1fr); gap: 1.5rem; align-items: start; }
    .wheel { order: -1; }
    .wheel svg { max-height: 44vh; width: auto; max-width: 100%; }
    .rings {
      background: repeating-radial-gradient(circle at 50% 24%, transparent 0 46px, var(--ring) 46px 47px);
      -webkit-mask-image: radial-gradient(circle at 50% 24%, #000 0, transparent 60%);
              mask-image: radial-gradient(circle at 50% 24%, #000 0, transparent 60%);
    }
    .brand { margin-bottom: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    .btn { transition: none; }
  }
</style>
</head>
<body>
<main class="stage">
  <div class="rings" aria-hidden="true"></div>

  <div class="copy">
    <p class="brand">Iken</p>
    <h1>Something is on the wheel.</h1>
    <p class="lead">We open this November with hand-thrown tableware, one-of-a-kind vases, and open studio hours where you can try the wheel yourself.</p>

    <p class="when">Doors open November 1 at 9:00 am.</p>
  </div>

  <figure class="wheel">
    <svg id="vase" viewBox="0 0 400 540" aria-hidden="true" focusable="false">
      <defs>
        <linearGradient id="shade" x1="0" x2="1" y1="0" y2="0">
          <stop offset="0" stop-color="#000" stop-opacity=".38"/>
          <stop offset=".28" stop-color="#fff" stop-opacity=".2"/>
          <stop offset=".5" stop-color="#fff" stop-opacity="0"/>
          <stop offset="1" stop-color="#000" stop-opacity=".45"/>
        </linearGradient>
        <clipPath id="clip"><path id="clipPath"/></clipPath>
      </defs>

      <!-- wheel head -->
      <path d="M30 470 v14 a170 26 0 0 0 340 0 v-14 z" fill="var(--wheel-side)"/>
      <ellipse cx="200" cy="470" rx="170" ry="26" fill="var(--wheel-top)"/>
      <ellipse id="contact" cx="200" cy="476" rx="80" ry="10" fill="var(--shadow)"/>

      <!-- vase -->
      <path id="body" fill="var(--vase-base)"/>
      <g clip-path="url(#clip)">
        <path d="M0 150 Q200 170 400 150" fill="none" stroke="var(--band)" stroke-width="1.5" opacity=".45"/>
        <path d="M0 176 Q200 196 400 176" fill="none" stroke="var(--band)" stroke-width="1.5" opacity=".45"/>
        <path d="M0 300 Q200 322 400 300 L400 336 Q200 358 0 336 Z" fill="var(--glow)"/>
        <path d="M0 350 Q200 372 400 350" fill="none" stroke="var(--band)" stroke-width="1.5" opacity=".45"/>
        <path d="M0 402 Q200 424 400 402" fill="none" stroke="var(--band)" stroke-width="1.5" opacity=".45"/>
      </g>
      <path id="shadeBody" fill="url(#shade)"/>
      <ellipse id="mouth" cx="200" cy="70" rx="40" ry="9" fill="var(--vase-dark)"/>
      <ellipse id="lip" cx="200" cy="70" rx="40" ry="9" fill="none" stroke="var(--band)" stroke-opacity=".5" stroke-width="1.5"/>
    </svg>
    <figcaption>
      <span>Drag along the vase to reshape it.</span>
      <button class="btn quiet" type="button" id="shuffle">Shape a new one</button>
    </figcaption>
  </figure>

  <p class="foot">&copy; 2026 Iken. Hand-thrown, small batch.</p>
</main>

<script>
(function () {
  /* ---------- Vase on the wheel ---------- */
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var svg = document.getElementById("vase");
  var body = document.getElementById("body");
  var shadeBody = document.getElementById("shadeBody");
  var clipPath = document.getElementById("clipPath");
  var mouth = document.getElementById("mouth");
  var lip = document.getElementById("lip");
  var contact = document.getElementById("contact");

  var N = 9, Y_TOP = 70, Y_BOT = 476, W = 400, H = 540, CX = 200;
  var ys = [];
  for (var i = 0; i < N; i++) ys.push(Y_TOP + (Y_BOT - Y_TOP) * i / (N - 1));

  var presets = [
    [40, 30, 44, 88, 120, 112, 84, 60, 66],
    [56, 46, 34, 52, 92, 126, 118, 88, 74],
    [34, 34, 60, 104, 110, 78, 56, 70, 90],
    [70, 86, 96, 92, 78, 62, 52, 58, 72],
    [28, 24, 30, 46, 70, 104, 132, 120, 96]
  ];
  var presetIndex = 0;
  var target = presets[0].slice();
  var disp = target.map(function () { return reduce ? 0 : 8; });
  if (reduce) disp = target.slice();

  function curve(p) {
    var s = "";
    for (var i = 0; i < p.length - 1; i++) {
      var p0 = p[i - 1] || p[i], p1 = p[i], p2 = p[i + 1], p3 = p[i + 2] || p2;
      var c1x = p1.x + (p2.x - p0.x) / 6, c1y = p1.y + (p2.y - p0.y) / 6;
      var c2x = p2.x - (p3.x - p1.x) / 6, c2y = p2.y - (p3.y - p1.y) / 6;
      s += "C" + c1x.toFixed(2) + " " + c1y.toFixed(2) + " " + c2x.toFixed(2) + " " + c2y.toFixed(2) + " " + p2.x.toFixed(2) + " " + p2.y.toFixed(2);
    }
    return s;
  }

  function render() {
    var right = disp.map(function (r, i) { return { x: CX + r, y: ys[i] }; });
    var left = disp.map(function (r, i) { return { x: CX - r, y: ys[i] }; }).reverse();
    var d = "M" + right[0].x.toFixed(2) + " " + right[0].y.toFixed(2) + curve(right) +
            "L" + left[0].x.toFixed(2) + " " + left[0].y.toFixed(2) + curve(left) + "Z";
    body.setAttribute("d", d);
    shadeBody.setAttribute("d", d);
    clipPath.setAttribute("d", d);
    var r0 = disp[0];
    [mouth, lip].forEach(function (e) {
      e.setAttribute("rx", r0.toFixed(2));
      e.setAttribute("ry", Math.max(1, r0 * 0.22).toFixed(2));
    });
    contact.setAttribute("rx", (disp[N - 1] + 22).toFixed(2));
  }

  var running = false;
  function frame() {
    var moving = false;
    for (var i = 0; i < N; i++) {
      var diff = target[i] - disp[i];
      if (Math.abs(diff) > 0.05) { disp[i] += diff * 0.14; moving = true; }
      else disp[i] = target[i];
    }
    render();
    if (moving) requestAnimationFrame(frame); else running = false;
  }
  function kick() {
    if (reduce) { disp = target.slice(); render(); return; }
    if (!running) { running = true; requestAnimationFrame(frame); }
  }

  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function limitFor(i) { return i === 0 ? [22, 110] : (i === N - 1 ? [40, 118] : [22, 150]); }

  var dragging = false;
  function apply(e) {
    var rect = svg.getBoundingClientRect();
    var x = (e.clientX - rect.left) * W / rect.width;
    var y = (e.clientY - rect.top) * H / rect.height;
    var f = (y - Y_TOP) / (Y_BOT - Y_TOP) * (N - 1);
    if (f < -0.6 || f > N - 0.4) return;
    var want = Math.abs(x - CX);
    for (var i = 0; i < N; i++) {
      var w = Math.max(0, 1 - Math.abs(i - f));
      if (w > 0) {
        var lim = limitFor(i);
        target[i] = clamp(target[i] + (want - target[i]) * w * 0.7, lim[0], lim[1]);
      }
    }
    kick();
  }
  svg.addEventListener("pointerdown", function (e) { dragging = true; svg.setPointerCapture(e.pointerId); apply(e); });
  svg.addEventListener("pointermove", function (e) { if (dragging) apply(e); });
  ["pointerup", "pointercancel"].forEach(function (t) {
    svg.addEventListener(t, function () { dragging = false; });
  });

  document.getElementById("shuffle").addEventListener("click", function () {
    presetIndex = (presetIndex + 1) % presets.length;
    target = presets[presetIndex].slice();
    kick();
  });

  render();
  kick();
})();
</script>
</body>
</html>
